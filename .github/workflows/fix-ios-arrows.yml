name: Fix iOS arrow rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-arrows.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force text presentation for arrows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          VS15 = '\ufe0e'
          for arrow in ['↘','↗','↓','→']:
              s = s.replace(arrow + VS15, arrow)
              s = s.replace(arrow, arrow + VS15)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No arrow changes needed.'
            exit 0
          fi
          git commit -m 'Fix iOS arrow rendering'
          git push
